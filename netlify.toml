[build]
  command = "npm run build"
  publish = "dist"

# Serverless functions (the GitHub activity radar keeps its token here — see docs/GITHUB_ACTIVITY_SETUP.md).
[functions]
  directory = "netlify/functions"

[build.environment]
  # Vite 8 needs Node 20.19+ / 22.12+.
  NODE_VERSION = "22"

# Single-page app: every path is served by index.html and routed client-side, so a
# refresh on /projects/01/arcgis-pro-salah-mcp works instead of returning a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets never change — cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Project screenshots and demo clips are replaced by re-uploading under the same name,
# so they get a week, not a year.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
